[global]
   workgroup = WORKGROUP
   server string = Fileserver Inova
   netbios name = inova
   security = user
   map to guest = bad user
   dns proxy = no
   passdb backend = tdbsam

   # --- Logs gerais ---
   log file = /var/log/samba/samba.log
   max log size = 50

# -------------------------------------------------------
# Compartilhamento PUBLICO — acesso sem senha (guest)
# -------------------------------------------------------
[publico]
   comment = Compartilhamento Publico
   path = /work0/publico
   browsable = yes
   writable = yes
   guest ok = yes
   guest only = yes
   create mask = 0666
   directory mask = 0777

   # --- Lixeira ---
   vfs objects = recycle full_audit
   recycle:repository = .lixeira
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:touch_mtime = yes
   recycle:maxsize = 0
   recycle:exclude = *.tmp *.temp ~$* .DS_Store Thumbs.db

   # --- Auditoria ---
   full_audit:prefix = %u|%I|%m|%S
   full_audit:success = create_file renameat unlinkat mkdirat
   full_audit:failure = connect
   full_audit:facility = LOCAL5
   full_audit:priority = NOTICE

# -------------------------------------------------------
# Compartilhamento PRIVADO — requer usuário e senha
# Apenas membros do grupo local 'samba_users'
# -------------------------------------------------------
[privado]
   comment = Compartilhamento Privado
   path = /work0/privado
   browsable = yes
   writable = yes
   guest ok = no
   valid users = @samba_users
   create mask = 0660
   directory mask = 0770

   # --- Lixeira ---
   vfs objects = recycle full_audit
   recycle:repository = .lixeira
   recycle:keeptree = yes
   recycle:versions = yes
   recycle:touch = yes
   recycle:touch_mtime = yes
   recycle:maxsize = 0
   recycle:exclude = *.tmp *.temp ~$* .DS_Store Thumbs.db

   # --- Auditoria ---
   full_audit:prefix = %u|%I|%m|%S
   full_audit:success = create_file renameat unlinkat mkdirat
   full_audit:failure = connect
   full_audit:facility = LOCAL5
   full_audit:priority = NOTICE
